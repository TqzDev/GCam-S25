<!DOCTYPE html>
<title>GCam Compatibility Dashboard</title>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  .app-frame {
    width: 100%;
    height: 100vh; /* เต็มจอ */
    border: none;
  }
</style>
</head>

<body>

<script>
const SCRIPT_ID = "AKfycby-vw7gBIxH_C9KtL2Od8FU3Ky1oGizhAjqCFgj8vxBgzEb3tv6VIfyloRwLToeC1_L";
const APP_URL = `https://script.google.com/macros/s/${SCRIPT_ID}/exec`;
</script>

<iframe id="app" class="app-frame"></iframe>

<script>
document.getElementById("app").src = APP_URL;

document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', function(e) {
  // F12
  if (e.key === "F12") {
    e.preventDefault();
  }

  // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+U
  if (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) {
    e.preventDefault();
  }

  if (e.ctrlKey && e.key === 'U') {
    e.preventDefault();
  }
});
</script>
</body>
</html>
